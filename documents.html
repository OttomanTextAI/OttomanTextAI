<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belgelerim — Divane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20260913-2">
    <style>
        .doc-detail-grid {
            display: grid;
            grid-template-columns: minmax(220px, 340px) 1fr;
            gap: 1.75rem;
            align-items: start;
        }
        .doc-detail-image-col {
            position: sticky;
            top: 1.5rem;
        }
        .doc-detail-image-frame {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doc-detail-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .doc-detail-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.3rem;
            margin-bottom: 1.1rem;
        }
        .doc-detail-card h3 {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            margin: 0 0 0.6rem 0;
        }
        @media (max-width: 720px) {
            .doc-detail-grid { grid-template-columns: 1fr; }
            .doc-detail-image-col { position: static; }
        }
        .doc-detail-info-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: left;
        }
        .doc-detail-info-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.7rem;
        }
        .doc-detail-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid var(--color-border);
        }
        .doc-detail-info-row:last-child { border-bottom: none; }
        .doc-detail-info-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            font-size: 0.82rem;
        }
        .doc-detail-info-value { font-weight: 600; text-align: right; font-size: 0.82rem; }
        .doc-detail-confidence-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-input);
            overflow: hidden;
            margin-top: 0.3rem;
        }
        .doc-detail-confidence-fill {
            height: 100%;
            background: var(--color-border-hover);
        }
        .doc-detail-tabs {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 1.3rem;
        }
        .doc-detail-tab-list {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .doc-detail-tab-btn {
            background: none;
            border: none;
            padding: 0.65rem 0;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--color-text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .doc-detail-tab-btn:hover {
            color: var(--color-text-main);
        }
        .doc-detail-tab-btn.active {
            color: var(--color-border-hover);
            border-bottom-color: var(--color-border-hover);
        }
        .doc-detail-confidence-badge {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            white-space: nowrap;
            margin-bottom: 0.6rem;
        }
        .doc-detail-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .doc-detail-tag {
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.3rem 0.8rem;
            font-size: 0.82rem;
        }
        .doc-detail-empty {
            color: var(--color-text-muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body class="dark-theme">
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button type="button" class="icon-btn side-menu-toggle" id="sideMenuToggle" title="Menü" aria-expanded="false" aria-controls="sideDrawer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <a href="index.html" class="brand-logo">
                    <img src="assets/icon.png" alt="Divane" class="brand-logo-img">
                    <span class="brand-subtitle">OSMANLICA ÇEVİRİ</span>
                </a>
            </div>

            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Ana Sayfa</a>
                <a href="index.html#about" class="nav-link">Hakkında</a>
                <a href="index.html#contact" class="nav-link">İletişim</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" title="Karanlık/Aydınlık Tema">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Ana sayfadaki (index.html) ile aynı sol menü çekmecesi — tutarlılık
         için buraya da eklendi (bkz. documents.js'teki aç/kapa kablolaması). -->
    <div class="side-drawer-overlay hidden" id="sideDrawerOverlay"></div>
    <aside class="side-drawer" id="sideDrawer" aria-hidden="true">
        <div class="side-drawer-header">
            <span class="side-drawer-title">Menü</span>
            <button type="button" class="modal-close" id="sideDrawerClose" title="Kapat">&times;</button>
        </div>
        <div class="side-drawer-body">
            <a href="documents.html" class="side-drawer-item">
                <span class="side-drawer-icon">📂</span>
                <span>Belgelerim</span>
            </a>
            <a href="index.html" class="side-drawer-item">
                <span class="side-drawer-icon">🏠</span>
                <span>Ana Sayfa</span>
            </a>
        </div>
    </aside>

    <main class="page-wrapper" style="padding-top: 2.5rem;">
        <h1 style="font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 1.5rem;">📂 Belgelerim</h1>

        <div id="loginRequired" class="hidden" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 2rem; text-align: center;">
            <p style="margin-bottom: 1.2rem;">Belgelerinizi görüntülemek için giriş yapmalısınız.</p>
            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön ve Giriş Yap</a>
        </div>

        <div id="listView">
            <div id="documentsList"></div>
        </div>

        <div id="detailView" class="hidden">
            <button type="button" id="backToListBtn" class="btn btn-outline" style="margin-bottom: 1.2rem;">← Listeye Dön</button>
            <div id="detailContent" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 1.5rem;"></div>
        </div>
    </main>

    <script src="documents.js?v=20260912-1"></script>
</body>
</html>
