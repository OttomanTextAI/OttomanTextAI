<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belgelerim — Divane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .doc-detail-grid {
            display: grid;
            grid-template-columns: minmax(220px, 340px) 1fr;
            gap: 1.75rem;
            align-items: start;
        }
        .doc-detail-image-col {
            position: sticky;
            top: 1.5rem;
        }
        .doc-detail-image-frame {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doc-detail-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .doc-detail-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.3rem;
            margin-bottom: 1.1rem;
        }
        .doc-detail-card h3 {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            margin: 0 0 0.6rem 0;
        }
        @media (max-width: 720px) {
            .doc-detail-grid { grid-template-columns: 1fr; }
            .doc-detail-image-col { position: static; }
        }
        .doc-detail-info-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.2rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: left;
        }
        .doc-detail-info-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.7rem;
        }
        .doc-detail-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.45rem 0;
            border-bottom: 1px solid var(--color-border);
        }
        .doc-detail-info-row:last-child { border-bottom: none; }
        .doc-detail-info-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            font-size: 0.82rem;
        }
        .doc-detail-info-value { font-weight: 600; text-align: right; font-size: 0.82rem; }
        .doc-detail-confidence-bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-input);
            overflow: hidden;
            margin-top: 0.3rem;
        }
        .doc-detail-confidence-fill {
            height: 100%;
            background: var(--color-border-hover);
        }
        .doc-detail-tabs {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--color-border);
            margin-bottom: 1.3rem;
        }
        .doc-detail-tab-list {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .doc-detail-tab-btn {
            background: none;
            border: none;
            padding: 0.65rem 0;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--color-text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .doc-detail-tab-btn:hover {
            color: var(--color-text-main);
        }
        .doc-detail-tab-btn.active {
            color: var(--color-border-hover);
            border-bottom-color: var(--color-border-hover);
        }
        .doc-detail-confidence-badge {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            white-space: nowrap;
            margin-bottom: 0.6rem;
        }
        .doc-detail-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .doc-detail-tag {
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.3rem 0.8rem;
            font-size: 0.82rem;
        }
        .doc-detail-empty {
            color: var(--color-text-muted);
            font-size: 0.88rem;
        }
    </style>
</head>
<body class="dark-theme">
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <img src="assets/logo.png" alt="Divane" class="brand-logo-img">
                <span class="brand-subtitle">OSMANLICA ÇEVİRİ</span>
            </a>
        </div>
    </header>

    <main class="page-wrapper" style="padding-top: 2.5rem;">
        <h1 style="font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 1.5rem;">📂 Belgelerim</h1>

        <div id="loginRequired" class="hidden" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 2rem; text-align: center;">
            <p style="margin-bottom: 1.2rem;">Belgelerinizi görüntülemek için giriş yapmalısınız.</p>
            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön ve Giriş Yap</a>
        </div>

        <div id="listView">
            <div id="documentsList"></div>
        </div>

        <div id="detailView" class="hidden">
            <button type="button" id="backToListBtn" class="btn btn-outline" style="margin-bottom: 1.2rem;">← Listeye Dön</button>
            <div id="detailContent" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 1.5rem;"></div>
        </div>
    </main>

    <script src="documents.js?v=20260911-9"></script>
</body>
</html>
