<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belgelerim — Divane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20260916-14">
    <style>
        .doc-detail-grid {
            display: grid;
            grid-template-columns: minmax(220px, 340px) 1fr;
            gap: 1.75rem;
            align-items: start;
        }
        .doc-detail-image-col {
            position: sticky;
            top: 1.5rem;
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.3rem;
        }
        .doc-detail-image-frame {
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doc-detail-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .doc-detail-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.1rem 1.3rem;
            display: flex;
            flex-direction: column;
            height: 560px;
        }
        .doc-detail-card h3 {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            color: var(--color-text-muted);
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--color-border);
            margin: 0 0 0.6rem 0;
            flex-shrink: 0;
        }
        .doc-detail-card .text-display {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        @media (max-width: 720px) {
            .doc-detail-grid { grid-template-columns: 1fr; }
            .doc-detail-image-col { position: static; }
        }
        .doc-detail-confidence-badge {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.35rem 0.8rem;
            border-radius: 999px;
            white-space: nowrap;
        }
        .doc-detail-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .doc-detail-tag {
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.3rem 0.8rem;
            font-size: 0.82rem;
        }
        .doc-detail-empty {
            color: var(--color-text-muted);
            font-size: 0.88rem;
        }
        .doc-trans-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.1rem;
            margin-bottom: 1.3rem;
        }
        @media (max-width: 900px) {
            .doc-trans-row { grid-template-columns: 1fr; }
        }
        .doc-analysis-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 1.3rem 1.4rem;
        }
        .doc-analysis-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .doc-analysis-title {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 700;
        }
        .doc-analysis-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }
        @media (max-width: 900px) {
            .doc-analysis-grid { grid-template-columns: 1fr; }
        }
        .doc-analysis-full-row {
            margin-top: 1.1rem;
        }
        .doc-analysis-col h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--color-text-muted);
            margin: 1.1rem 0 0.5rem 0;
        }
        .doc-analysis-col h4:first-child { margin-top: 0; }
        .doc-analysis-col p {
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .doc-analysis-mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
        }
        .doc-analysis-mini-box {
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.8rem;
        }
        .doc-analysis-mini-box.full { grid-column: 1 / -1; }
        .doc-analysis-mini-label {
            font-size: 0.72rem;
            color: var(--color-text-muted);
            margin-bottom: 0.2rem;
        }
        .doc-analysis-mini-value { font-size: 0.85rem; font-weight: 600; }
        .doc-analysis-col ul {
            margin: 0;
            padding-left: 1.1rem;
            font-size: 0.85rem;
            line-height: 1.7;
        }
        .doc-analysis-notes {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            margin-top: 1.3rem;
            font-size: 0.85rem;
            color: var(--color-text-muted);
        }
        .doc-count-badge {
            background: var(--bg-input);
            border: 1px solid var(--color-border);
            border-radius: 999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--color-text-muted);
        }
        .doc-list-toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.4rem;
        }
        .doc-card {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 0.8rem;
            cursor: pointer;
        }
        .doc-search-input {
            width: 220px;
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.9rem;
            font-size: 0.88rem;
            color: var(--color-text-main);
        }
        .doc-search-input:focus {
            outline: none;
            border-color: var(--color-border-hover);
        }
        .doc-filter-dropdown { position: relative; }
        .doc-sort-select {
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            color: var(--color-text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .doc-filter-active-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--color-border-hover);
        }
        .doc-filter-menu {
            position: absolute;
            top: calc(100% + 0.4rem);
            right: 0;
            min-width: 230px;
            max-height: 320px;
            overflow-y: auto;
            background: var(--bg-card-subtle);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            padding: 0.5rem;
            z-index: 20;
        }
        .doc-filter-menu-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--color-text-muted);
            padding: 0.5rem 0.6rem 0.2rem;
        }
        .doc-filter-menu-item {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 0.5rem 0.6rem;
            font-size: 0.85rem;
            color: var(--color-text-main);
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        .doc-filter-menu-item:hover { background: var(--bg-input); }
        .doc-filter-menu-item.active { background: var(--color-gold-bg); font-weight: 700; }
        .doc-card-type-badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(20, 14, 8, 0.72);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            max-width: calc(100% - 1rem);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tool-btn[disabled] {
            opacity: 0.35;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="dark-theme">
    <header class="navbar">
        <div class="nav-container">

                <a href="index.html" class="brand-logo">

                <span>Belgelerim</span>
            </a>
            <a href="notes.html" class="side-drawer-item">

    <main class="page-wrapper" style="padding-top: 2.5rem;">
        <div style="display:flex; align-items:center; gap:0.7rem; margin-bottom:1.5rem; flex-wrap:wrap;">
            <h1 style="font-family: var(--font-heading); font-size: 1.8rem; margin:0;">📂 Belgelerim</h1>
            <span id="docsCountBadge" class="doc-count-badge hidden"></span>
        </div>

        <div id="loginRequired" class="hidden" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 2rem; text-align: center;">
            <p style="margin-bottom: 1.2rem;">Belgelerinizi görüntülemek için giriş yapmalısınız.</p>
            <a href="index.html" class="btn btn-primary">Ana Sayfaya Dön ve Giriş Yap</a>
        </div>

        <div id="listView">
            <div class="doc-list-toolbar">
                <input type="text" id="docSearchInput" class="doc-search-input" placeholder="Belgelerde ara...">
                <div class="doc-filter-dropdown" id="docFilterDropdown">
                    <button type="button" class="doc-sort-select" id="docFilterToggle">
                        <span>Filtrele</span>
                        <span class="doc-filter-active-dot hidden" id="docFilterActiveDot"></span>
                        <span>▾</span>
                    </button>
                    <div class="doc-filter-menu hidden" id="docFilterMenu">
                        <div class="doc-filter-menu-label">Sırala</div>
                        <button type="button" class="doc-filter-menu-item" data-sort="date-desc">Tarihe Göre En Yeni</button>
                        <button type="button" class="doc-filter-menu-item" data-sort="date-asc">Tarihe Göre En Eski</button>
                        <div class="doc-filter-menu-label">Belge Türü</div>
                        <div id="docFilterTypeList"></div>
                    </div>
                </div>
                <div class="doc-filter-dropdown" id="docTypeFilterDropdown">
                    <button type="button" class="doc-sort-select" id="docTypeFilterToggle">
                        <span>Belge Türü</span>
                        <span class="doc-filter-active-dot hidden" id="docTypeFilterActiveDot"></span>
                        <span>▾</span>
                    </button>
                    <div class="doc-filter-menu hidden" id="docTypeFilterMenu">
                        <div id="docTypeFilterTypeList"></div>
                    </div>
                </div>
            </div>
            <div id="documentsList"></div>
        </div>

        <div id="detailView" class="hidden">
            <button type="button" id="backToListBtn" class="btn btn-outline" style="margin-bottom: 1.2rem;">← Listeye Dön</button>
            <div id="detailContent" style="background: var(--bg-card); border-radius: var(--radius-md); padding: 1.5rem;"></div>
        </div>
    </main>

    <script src="documents.js?v=20260915-11"></script>
