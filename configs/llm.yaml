provider: relaygpu
model: google/gemini-3.5-flash

# Tried once, on the full (unsplit) image, only as a last resort after
# both the normal 2-attempt request and the split-image fallback have
# failed due to the model looping on the same phrase.
fallback_model: openai/gpt-5.5

generation:
  temperature: 0.1
  max_tokens: 8192