enhancement:
  denoise:
    diameter: 5
    sigma_color: 30.0
    sigma_space: 30.0

  background_normalization:
    kernel_size: 31

  stain_suppression:
    kernel_size: 51

  clahe:
    clip_limit: 2.0
    tile_grid_size:
      - 8
      - 8
  morphology:
    enabled: false
    kernel_size: 2
    iterations: 1

  speckle_removal:
    enabled: false
    min_area: 12
    anchor_area: 35
    horizontal_distance: 18
    vertical_distance: 8

  bleed_through:
    enabled: fasle
    background_kernel_size: 31
    min_contrast: 12
    foreground_gain: 3.0

  text_region:
    enabled: false
    horizontal_kernel_width: 35
    vertical_kernel_height: 5
    min_region_area_ratio: 0.05
    padding: 15
threshold:
  enabled: true
  default_method: otsu

  adaptive:
    block_size: 11
    constant: 2

deskew:
  minimum_text_line_count: 2
  minimum_aspect_ratio: 1.5
  maximum_accepted_angle: 25.0

  contour:
    minimum_width: 30
    minimum_height: 5
    minimum_width_ratio: 0.08
    maximum_width_ratio: 0.98
    minimum_height_ratio: 0.005
    maximum_height_ratio: 0.15

  morphology:
    minimum_kernel_width: 9
    kernel_width_ratio: 0.025
    minimum_border_size: 5
    border_size_ratio: 0.02

  outlier:
    minimum_allowed_deviation: 1.0
    mad_multiplier: 3.0

perspective:
  minimum_document_area_ratio: 0.20
  approximation_epsilon_ratio: 0.02

  canny:
    lower_threshold: 50
    upper_threshold: 150

  gaussian_kernel_size:
    - 5
    - 5

  morphology:
    kernel_size:
      - 7
      - 7
    iterations: 2

  speckle_removal:
    enabled: true
    min_area: 12
    line_kernel_width: 25

profiles:
  printed:
    threshold_enabled: true
    threshold_method: otsu
    text_region_enabled: true
    bleed_through_enabled: true
    stain_suppression_enabled: true
    morphology_enabled: true
    speckle_removal_enabled: true

  manuscript:
    threshold_enabled: false
    threshold_method: otsu
    text_region_enabled: false
    bleed_through_enabled: false
    stain_suppression_enabled: false
    morphology_enabled: false
    speckle_removal_enabled: false