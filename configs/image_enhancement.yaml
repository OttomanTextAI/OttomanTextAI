enhancement:
  denoise:
    diameter: 5
    sigma_color: 30.0
    sigma_space: 30.0

  background_normalization:
    kernel_size: 31

  stain_suppression:
    kernel_size: 31

  clahe:
    clip_limit: 2.0
    tile_grid_size:
      - 8
      - 8
  morphology:
    enabled: false
    kernel_size: 2
    iterations: 1

  speckle_removal:
    enabled: false
    min_area: 12
    anchor_area: 35
    horizontal_distance: 18
    vertical_distance: 8

  speckle_removal_v2:
    enabled: false
    min_area: 14
    text_anchor_area: 40
    horizontal_distance: 12
    vertical_distance: 5
    max_isolated_distance: 8
  
  speckle_removal_v3:
    enabled: false
    min_area: 14
    line_kernel_width: 35
    line_kernel_height: 3
    line_dilation_iterations: 1
    safe_vertical_margin: 8

  bleed_through:
    enabled: false
    background_kernel_size: 41
    min_contrast: 6
    foreground_gain: 1.3
    edge_threshold: 12
    connectivity_kernel_size: 5
  
  line_removal:
    enabled: false
    min_line_length_ratio: 0.45
    max_line_gap: 20
    hough_threshold: 80
    line_thickness: 7
  
  text_region:
    enabled: false
    horizontal_kernel_width: 35
    vertical_kernel_height: 5
    min_region_area_ratio: 0.05
    padding: 15

  text_regions:
    enabled: true
    horizontal_kernel_width: 25
    vertical_kernel_height: 3
    min_region_width_ratio: 0.05
    min_region_height_ratio: 0.015
    min_region_area_ratio: 0.002
    padding: 8

threshold:
  enabled: true
  default_method: otsu

  adaptive:
    block_size: 51
    constant: 10

deskew:
  minimum_text_line_count: 2
  minimum_aspect_ratio: 1.5
  maximum_accepted_angle: 25.0

  contour:
    minimum_width: 30
    minimum_height: 5
    minimum_width_ratio: 0.08
    maximum_width_ratio: 0.98
    minimum_height_ratio: 0.005
    maximum_height_ratio: 0.15

  morphology:
    minimum_kernel_width: 9
    kernel_width_ratio: 0.025
    minimum_border_size: 5
    border_size_ratio: 0.02

  outlier:
    minimum_allowed_deviation: 1.0
    mad_multiplier: 3.0

perspective:
  minimum_document_area_ratio: 0.20
  approximation_epsilon_ratio: 0.02

  canny:
    lower_threshold: 50
    upper_threshold: 150

  gaussian_kernel_size:
    - 5
    - 5

  morphology:
    kernel_size:
      - 7
      - 7
    iterations: 2

  speckle_removal:
    enabled: true
    min_area: 12
    line_kernel_width: 25

profiles:
  printed:
    threshold_enabled: true
    threshold_method: otsu

    upscale_enabled: false
    upscale_factor: 2.0

    background_normalization_enabled: true
    clahe_enabled: true

    text_region_enabled: false
    bleed_through_enabled: false
    stain_suppression_enabled: false
    morphology_enabled: false
    speckle_removal_enabled: false


  printed-degraded:
    threshold_enabled: true
    threshold_method: otsu

    upscale_enabled: false
    upscale_factor: 2.0

    background_normalization_enabled: true
    clahe_enabled: false

    text_region_enabled: false
    bleed_through_enabled: false
    stain_suppression_enabled: true
    morphology_enabled: false
    speckle_removal_enabled: false
  delicate:
    threshold_enabled: true
    threshold_method: adaptive

    upscale_enabled: true
    upscale_factor: 2.0

    background_normalization_enabled: false
    clahe_enabled: false

    text_region_enabled: false
    bleed_through_enabled: false
    stain_suppression_enabled: false
    morphology_enabled: false
    speckle_removal_enabled: false


  manuscript:
    threshold_enabled: false
    threshold_method: otsu

    upscale_enabled: true
    upscale_factor: 2.0

    background_normalization_enabled: false
    clahe_enabled: true

    text_region_enabled: false
    bleed_through_enabled: false
    stain_suppression_enabled: false
    morphology_enabled: false
    speckle_removal_enabled: false