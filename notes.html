<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Divane - Notlarım</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .notes-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .notes-title {
            margin: 0;
        }

        .notes-back {
            text-decoration: none;
        }

        .notes-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .notes-input {
            flex: 1;
            min-height: 44px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: inherit;
        }

        .notes-add-btn {
            min-width: 110px;
        }

        .notes-status {
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;

            padding: 14px;
            border-radius: 10px;

            border: 1px solid var(--color-border);
            background: var(--color-surface);
        }

        .note-item.completed .note-content {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .note-checkbox {
            margin-top: 4px;
            cursor: pointer;
        }

        .note-main {
            flex: 1;
            min-width: 0;
        }

        .note-content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-meta {
            margin-top: 6px;
            font-size: 12px;
            opacity: 0.65;
        }

        .note-delete {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
        }

        .notes-empty {
            padding: 24px;
            text-align: center;
            opacity: 0.7;

            border: 1px dashed var(--color-border);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <main class="notes-page">

        <div class="notes-header">
            <div>
                <h1 class="notes-title">📝 Notlarım</h1>
                <div id="notesDocumentInfo"></div>
            </div>

            <a href="index.html?restore=1" class="btn btn-outline notes-back">
            >
                ← Ana Sayfa
            </a>
        </div>

        <form id="notesForm" class="notes-form">
            <textarea
                id="notesInput"
                class="notes-input"
                placeholder="Yeni bir not yaz..."
                rows="2"
            ></textarea>

            <button
                type="submit"
                class="btn notes-add-btn"
            >
                Not Ekle
            </button>
        </form>

        <div
            id="notesStatus"
            class="notes-status"
        ></div>

        <div
            id="notesList"
            class="notes-list"
        ></div>

    </main>

    <script src="notes.js"></script>

</body>
</html>
