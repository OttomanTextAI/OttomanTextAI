<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Divane - Notlarım</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
.notes-page {
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 80px;
}

.notes-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--color-border);
}

.notes-title {
    margin: 0 0 6px;
    font-family: "Cormorant Garamond", serif;
    font-size: 2.3rem;
    font-weight: 700;
}

#notesDocumentInfo {
    font-size: 0.9rem;
    color: var(--color-text-muted);
}

.notes-back {
    flex-shrink: 0;
    text-decoration: none;
}

.notes-form {
    display: flex;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 20px;
    padding: 18px;

    border: 1px solid var(--color-border);
    border-radius: 14px;
    background: var(--color-surface);
}

.notes-input {
    flex: 1;
    min-height: 70px;
    padding: 12px 14px;

    resize: vertical;

    border: 1px solid var(--color-border);
    border-radius: 9px;

    background: transparent;
    color: inherit;

    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
}

.notes-input:focus {
    outline: none;
    border-color: var(--color-primary);
}

.notes-add-btn {
    min-width: 120px;
    align-self: stretch;
}

.notes-status {
    min-height: 20px;
    margin-bottom: 16px;

    font-size: 0.85rem;
    color: var(--color-text-muted);
}

.notes-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Belge grupları */
.notes-document-group {
    overflow: hidden;

    border: 1px solid var(--color-border);
    border-radius: 14px;

    background: var(--color-surface);
}

.notes-document-title {
    padding: 14px 18px;

    border-bottom: 1px solid var(--color-border);

    font-family: "Cormorant Garamond", serif;
    font-size: 1.15rem;
    font-weight: 700;
}

/* Tek not */
.note-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;

    padding: 15px 18px;

    border-bottom: 1px solid var(--color-border);
}

.note-item:last-child {
    border-bottom: none;
}

.note-item:hover {
    background: rgba(255, 255, 255, 0.025);
}

.note-item.completed .note-content {
    text-decoration: line-through;
    opacity: 0.5;
}

.note-checkbox {
    margin-top: 5px;
    cursor: pointer;
}

.note-main {
    flex: 1;
    min-width: 0;
}

.note-content {
    white-space: pre-wrap;
    word-break: break-word;

    line-height: 1.55;
}

.note-meta {
    margin-top: 7px;

    font-size: 0.75rem;
    color: var(--color-text-muted);
}

.note-delete {
    padding: 5px;

    border: none;
    background: transparent;

    color: var(--color-text-muted);

    cursor: pointer;
    font-size: 16px;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

.note-delete:hover {
    color: #c85d5d;
    transform: scale(1.08);
}

.notes-empty {
    padding: 40px 24px;

    text-align: center;
    color: var(--color-text-muted);

    border: 1px dashed var(--color-border);
    border-radius: 14px;

    background: var(--color-surface);
}

@media (max-width: 700px) {
    .notes-page {
        padding: 30px 16px 60px;
    }

    .notes-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .notes-form {
        flex-direction: column;
    }

    .notes-add-btn {
        min-height: 44px;
    }

    .nav-menu {
        display: none;
    }
}
    </style>
</head>

<body class="dark-theme">
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <button type="button" class="icon-btn side-menu-toggle" id="sideMenuToggle" title="Menü" aria-expanded="false" aria-controls="sideDrawer">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <a href="index.html?restore=1" class="brand-logo">
                    <img src="assets/icon.png" alt="Divane" class="brand-logo-img">
                    <span class="brand-subtitle">OSMANLICA ÇEVİRİ</span>
                </a>
            </div>

            <nav class="nav-menu">
                <a href="index.html?restore=1" class="nav-link">Ana Sayfa</a>
                <a href="index.html#about" class="nav-link">Hakkında</a>
                <a href="index.html#contact" class="nav-link">İletişim</a>
            </nav>

            <div class="nav-actions">
                <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" title="Karanlık/Aydınlık Tema">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Ana sayfadaki (index.html) ile aynı sol menü çekmecesi — tutarlılık
         için buraya da eklendi (bkz. notes.js'teki aç/kapa kablolaması).
         Harita/Hakkında/İletişim modalları yalnızca index.html'de tanımlı
         olduğu için buradan index.html'e bağlanıyor (data-modal yerine
         gerçek href). -->
    <div class="side-drawer-overlay hidden" id="sideDrawerOverlay"></div>
    <aside class="side-drawer" id="sideDrawer" aria-hidden="true">
        <div class="side-drawer-header">
            <span class="side-drawer-title">Menü</span>
            <button type="button" class="modal-close" id="sideDrawerClose" title="Kapat">&times;</button>
        </div>
        <div class="side-drawer-body">
            <img src="assets/ornament-divider.png" alt="" aria-hidden="true" class="side-drawer-flourish">
            <span class="side-drawer-section-label">Belgelerim</span>
            <a href="documents.html" class="side-drawer-item">
                <span class="side-drawer-icon">📂</span>
                <span>Belgelerim</span>
            </a>
            <a href="notes.html" class="side-drawer-item">
                <span class="side-drawer-icon">📝</span>
                <span>Notlarım</span>
            </a>
            <a href="index.html#map" class="side-drawer-item">
                <span class="side-drawer-icon">🗺️</span>
                <span>Harita</span>
            </a>

            <span class="side-drawer-section-label">Hesap</span>
            <a href="profile.html" class="side-drawer-item">
                <span class="side-drawer-icon">👤</span>
                <span>Profilim</span>
            </a>
            <span class="side-drawer-section-label">Site</span>
            <a href="index.html#about" class="side-drawer-item">
                <span class="side-drawer-icon">ℹ️</span>
                <span>Hakkında</span>
            </a>
            <a href="index.html#contact" class="side-drawer-item">
                <span class="side-drawer-icon">✉️</span>
                <span>İletişim</span>
            </a>
        </div>
    </aside>

    <main class="notes-page">

        <div class="notes-header">
            <div>
                <h1 class="notes-title">📝 Notlarım</h1>
                <div id="notesDocumentInfo"></div>
            </div>

            <a href="index.html?restore=1" class="btn btn-outline notes-back">
                ← Ana Sayfa
            </a>
        </div>

        <form id="notesForm" class="notes-form">
            <textarea
                id="notesInput"
                class="notes-input"
                placeholder="Yeni bir not yaz..."
                rows="2"
            ></textarea>

            <button
                type="submit"
                class="btn notes-add-btn"
            >
                Not Ekle
            </button>
        </form>

        <div
            id="notesStatus"
            class="notes-status"
        ></div>

        <div
            id="notesList"
            class="notes-list"
        ></div>

    </main>

    <script src="notes.js"></script>

</body>
</html>
