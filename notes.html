<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Divane - Notlarım</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
    .notes-page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 2rem 5rem;
    }

    /* =========================
    PAGE HEADER
    ========================= */

    .notes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1.5rem;

        margin-bottom: 2rem;
        padding-bottom: 1.25rem;

        border-bottom: 1px solid var(--color-border);
    }

    .notes-title {
        margin: 0 0 0.35rem;

        font-family: var(--font-heading);
        font-size: 2.35rem;
        font-weight: 700;
        line-height: 1.2;

        color: var(--color-text-main);
    }

    #notesDocumentInfo {
        font-size: 0.9rem;
        color: var(--color-text-muted);
    }

    .notes-back {
        flex-shrink: 0;
    }

    /* =========================
    NEW NOTE CARD
    ========================= */

    .notes-form {
        display: flex;
        align-items: stretch;
        gap: 1rem;

        margin-bottom: 0.75rem;
        padding: 1.25rem;

        background: var(--bg-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);

        transition:
            background-color var(--transition-normal),
            border-color var(--transition-normal),
            box-shadow var(--transition-fast);
    }

    .notes-form:focus-within {
        border-color: var(--color-gold);
        box-shadow:
            var(--shadow-md),
            0 0 0 3px var(--color-gold-bg);
    }

    .notes-input {
        flex: 1;

        min-height: 76px;
        padding: 0.85rem 1rem;

        resize: vertical;

        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);

        background: var(--bg-input);
        color: var(--color-text-main);

        font-family: var(--font-sans);
        font-size: 0.95rem;
        line-height: 1.55;

        outline: none;

        transition:
            border-color var(--transition-fast),
            background-color var(--transition-normal),
            box-shadow var(--transition-fast);
    }

    .notes-input::placeholder {
        color: var(--color-text-muted);
    }

    .notes-input:focus {
        border-color: var(--color-gold);
        box-shadow: 0 0 0 3px var(--color-gold-bg);
    }

    .notes-add-btn {
        min-width: 130px;
        align-self: stretch;

        background: var(--color-primary-navy);
        color: #fff;

        border: 1px solid var(--color-primary-navy);
        box-shadow: 0 4px 14px rgba(13, 22, 39, 0.25);
    }

    .notes-add-btn:hover {
        background: var(--color-primary-navy-hover);
        border-color: var(--color-gold);

        transform: translateY(-2px);

        box-shadow: 0 8px 20px rgba(13, 22, 39, 0.30);
    }

    /* =========================
    STATUS
    ========================= */

    .notes-status {
        min-height: 22px;
        margin: 0.5rem 0 1.25rem;

        font-size: 0.85rem;
        color: var(--color-text-muted);
    }

    /* =========================
    NOTE LIST
    ========================= */

    .notes-list {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
    }

    /* Her belge ayrı kart */

    .notes-document-group {
        overflow: hidden;

        background: var(--bg-card);

        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);

        box-shadow: var(--shadow-md);

        transition:
            background-color var(--transition-normal),
            border-color var(--transition-normal),
            box-shadow var(--transition-fast),
            transform var(--transition-fast);
    }

    .notes-document-group:hover {
        border-color: rgba(197, 160, 89, 0.45);
        box-shadow: var(--shadow-lg);
    }

    /* Belge başlığı */

    .notes-document-title {
        position: relative;

        padding: 1rem 1.25rem 1rem 1.5rem;

        background: var(--bg-card-subtle);
        border-bottom: 1px solid var(--color-border);

        font-family: var(--font-heading);
        font-size: 1.2rem;
        font-weight: 700;

        color: var(--color-text-main);
    }

    .notes-document-title::before {
        content: '';

        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;

        width: 3px;

        background:
            linear-gradient(
                to bottom,
                var(--color-gold),
                var(--color-gold-light)
            );
    }

    /* =========================
    SINGLE NOTE
    ========================= */

    .note-item {
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;

        padding: 1rem 1.25rem;

        border-bottom: 1px solid var(--color-border);

        transition:
            background-color var(--transition-fast);
    }

    .note-item:last-child {
        border-bottom: none;
    }

    .note-item:hover {
        background: var(--color-gold-bg);
    }

    .note-main {
        flex: 1;
        min-width: 0;
    }

    .note-content {
        white-space: pre-wrap;
        word-break: break-word;

        color: var(--color-text-main);

        font-size: 0.94rem;
        line-height: 1.6;

        transition:
            opacity var(--transition-fast),
            color var(--transition-fast);
    }

    .note-meta {
        margin-top: 0.4rem;

        font-size: 0.74rem;
        color: var(--color-text-muted);
    }

    /* Tamamlanan not */

    .note-item.completed .note-content {
        text-decoration: line-through;
        color: var(--color-text-muted);
        opacity: 0.55;
    }

    /* =========================
    CHECKBOX
    ========================= */

    .note-checkbox {
        appearance: none;
        -webkit-appearance: none;

        flex-shrink: 0;

        width: 19px;
        height: 19px;
        margin-top: 3px;

        border: 1.5px solid var(--color-border);
        border-radius: 5px;

        background: var(--bg-input);

        cursor: pointer;

        display: grid;
        place-content: center;

        transition: all var(--transition-fast);
    }

    .note-checkbox:hover {
        border-color: var(--color-gold);
    }

    .note-checkbox:checked {
        background: var(--color-gold);
        border-color: var(--color-gold);
    }

    .note-checkbox:checked::after {
        content: '✓';

        color: #fff;

        font-size: 12px;
        font-weight: 700;
        line-height: 1;
    }

    /* =========================
    DELETE
    ========================= */

    .note-delete {
        flex-shrink: 0;

        width: 32px;
        height: 32px;

        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        border: 1px solid transparent;
        border-radius: var(--radius-sm);

        background: transparent;
        color: var(--color-text-muted);

        cursor: pointer;
        font-size: 16px;

        transition: all var(--transition-fast);
    }

    .note-delete:hover {
        color: var(--color-accent-red);
        background: rgba(217, 83, 79, 0.08);
        border-color: rgba(217, 83, 79, 0.2);

        transform: scale(1.05);
    }

    /* =========================
    EMPTY STATE
    ========================= */

    .notes-empty {
        padding: 3rem 1.5rem;

        text-align: center;
        color: var(--color-text-muted);

        border: 1px dashed var(--color-border);
        border-radius: var(--radius-lg);

        background: var(--bg-card);

        box-shadow: var(--shadow-sm);
    }

    /* =========================
    RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

        .notes-page {
            padding: 2rem 1rem 4rem;
        }

        .notes-header {
            align-items: flex-start;
            flex-direction: column;
        }

        .notes-title {
            font-size: 2rem;
        }

        .notes-form {
            flex-direction: column;
            padding: 1rem;
        }

        .notes-add-btn {
            min-height: 46px;
            width: 100%;
        }

        .note-item {
            padding: 0.9rem 1rem;
        }

        .notes-document-title {
            padding: 0.9rem 1rem 0.9rem 1.25rem;
        }

        .nav-menu {
            display: none;
        }
    }
    </style>
</head>
